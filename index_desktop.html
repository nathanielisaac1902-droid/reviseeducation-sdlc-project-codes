          <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
      </button>
    );

    const getInitials = (name) => {
      if (!name) return 'RS';
      const parts = name.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }
      return name.slice(0, 2).toUpperCase();
    };

    const DEFAULT_AVATAR_URL = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80';

    function UserAvatar({ user, size = "w-8 h-8", fontSize = "text-xs" }) {
      const [imgError, setImgError] = useState(false);
      const name = user ? user.name : '';
      const avatarUrl = user?.avatarUrl || user?.avatar || DEFAULT_AVATAR_URL;
      const initials = getInitials(name);

      useEffect(() => {
        setImgError(false);
      }, [avatarUrl]);

      if (avatarUrl && !imgError) {
        return (
          <div className={`${size} rounded-full overflow-hidden flex-shrink-0 bg-orange-500 flex items-center justify-center border border-slate-700`}>
            <img
              src={avatarUrl}
              alt={name || 'User Avatar'}
              className="w-full h-full object-cover"
              onError={() => setImgError(true)}
            />
          </div>
        );
      }

      return (
        <div className={`${size} rounded-full bg-orange-500 text-white font-bold flex items-center justify-center flex-shrink-0 uppercase tracking-wider ${fontSize} border border-slate-700 shadow-inner select-none`}>
          {initials}
        </div>
      );
    }

    function App() {
      const [isAuthenticatedState, setIsAuthenticatedState] = useState(() => {
        return window.ReviseAuth ? window.ReviseAuth.isAuthenticated() : false;
      });

      const [user, setUser] = useState(() => {
        return window.ReviseAuth ? window.ReviseAuth.getAuthUser() : {
          name: 'Amara Okeke',
          email: 'amara.okeke@stanford.edu',
          isPro: true,
          avatarUrl: DEFAULT_AVATAR_URL
        };
      });

      const [currentRoute, setCurrentRoute] = useState(() => {
        const isAuth = window.ReviseAuth ? window.ReviseAuth.isAuthenticated() : false;
        return isAuth ? '/dashboard' : '/login';
      });
      const [profileTab, setProfileTab] = useState('overview');

      const [selectedQuiz, setSelectedQuiz] = useState(QUIZ_DATABASE[1]);
      const [activeQuestionIdx, setActiveQuestionIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [flaggedQuestions, setFlaggedQuestions] = useState({});
      const [quizResults, setQuizResults] = useState(null);

      const [quizHistory, setQuizHistory] = useState([
        { id: 'h1', title: 'Cellular Respiration & Krebs Cycle Quiz', subject: 'BIOLOGY', percent: 90, date: '2 hours ago', correctCount: 4, totalCount: 5 },
        { id: 'h2', title: 'Organic Chemistry Flashcard Deck Study', subject: 'CHEMISTRY', percent: 80, date: 'Yesterday', correctCount: 4, totalCount: 5 }
      ]);

      const [isDarkMode, setIsDarkMode] = useState(false);

      const [flashcardDecks, setFlashcardDecks] = useState(DEFAULT_DECKS);
      const [currentDeck, setCurrentDeck] = useState(DEFAULT_DECKS[0]);
      const [deckCardIndex, setDeckCardIndex] = useState(0);

      const [isAiChatOpen, setIsAiChatOpen] = useState(false);
      const [aiMessages, setAiMessages] = useState([
        { sender: 'ai', text: 'Hello! I am your ReviseSphere AI Study Assistant. How can I help you master your subjects today?' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [isAiTyping, setIsAiTyping] = useState(false);

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDarkMode]);

      useEffect(() => {
        if (isAuthenticatedState && 'Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }
      }, [isAuthenticatedState]);

      // Auth Guard Effect
      useEffect(() => {
        if (!isAuthenticatedState && currentRoute !== '/login' && currentRoute !== '/signup') {
          setCurrentRoute('/login');
        }
      }, [isAuthenticatedState, currentRoute]);

      const navigate = (route, options = {}) => {
        const isAuth = window.ReviseAuth ? window.ReviseAuth.isAuthenticated() : isAuthenticatedState;
        if (!isAuth && route !== '/login' && route !== '/signup') {
          setCurrentRoute('/login');
        } else {
          if (route === '/profile') {
            setProfileTab(options.tab || 'overview');
          }
          setCurrentRoute(route);
        }
        window.scrollTo(0, 0);
      };

      const handleLogout = () => {
        if (window.ReviseAuth) {
          window.ReviseAuth.logoutUser();
        }
        setIsAuthenticatedState(false);
        setCurrentRoute('/login');
      };

      const startQuiz = (quizObj) => {
        try {
          localStorage.removeItem(`quiz_progress_${quizObj.id}`);
        } catch (error) {
          // Storage may be unavailable in private browsing.
        }
        setSelectedQuiz(quizObj);
        setActiveQuestionIdx(0);
        setQuizResults(null);
        setUserAnswers({});
        setFlaggedQuestions({});
        navigate('/quiz/7');
      };

      const submitQuiz = () => {
        let correctCount = 0;
        selectedQuiz.questions.forEach((q) => {
          const ansKey = `${selectedQuiz.id}_q${q.id}`;
          if (userAnswers[ansKey] === q.correctOption) {
            correctCount += 1;
          }
        });
        const percent = Math.round((correctCount / selectedQuiz.questions.length) * 100);

        const resultObj = {
          quiz: selectedQuiz,
          userAnswers: { ...userAnswers },
          correctCount,
          total: selectedQuiz.questions.length,
          percent,
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        };
        setQuizResults(resultObj);

        const newHistoryItem = {
          id: 'h-' + Date.now(),
          title: selectedQuiz.title + ' Quiz',
          subject: selectedQuiz.subject,
          percent: percent,
          date: 'Just now',
          correctCount,
          totalCount: selectedQuiz.questions.length
        };
        setQuizHistory(prev => [newHistoryItem, ...prev]);

        if (window.ReviseFX) {
          window.ReviseFX.playSound('celebrate');
          if (percent >= 60) {
            window.ReviseFX.triggerConfetti();
          }
        }

        navigate('/quiz/results');
      };

      const handleSendMessage = (textToSend) => {
        const msg = textToSend || chatInput;
        if (!msg.trim()) return;

        const newMessages = [...aiMessages, { sender: 'user', text: msg }];
        setAiMessages(newMessages);
        setChatInput('');
        setIsAiTyping(true);

        setTimeout(() => {
          let aiReply = "That's a great question! Based on your revision notes, focusing on core formulas and active recall using flashcards will boost your memory retention by over 40%.";
          if (msg.toLowerCase().includes('krebs') || msg.toLowerCase().includes('bio')) {
            aiReply = "The Krebs cycle (Citric Acid Cycle) takes place in the mitochondrial matrix. It processes Acetyl-CoA derived from pyruvate and yields NADH, FADH₂, and 2 ATP per glucose molecule!";
          } else if (msg.toLowerCase().includes('stoichiometry') || msg.toLowerCase().includes('chem')) {
            aiReply = "For stoichiometry, always balance your chemical equation first! Then convert given masses to moles using molar mass before applying the stoichiometric mole ratio.";
          } else if (msg.toLowerCase().includes('quiz') || msg.toLowerCase().includes('test')) {
            aiReply = "You can take timed practice quizzes in the Quiz Engine! Flag any tough questions to review before submitting.";
          } else if (msg.toLowerCase().includes('help')) {
            aiReply = { '/quiz/7': 'You are taking a quiz. Would you like a hint or explanation?', '/flashcard-study': 'You are studying flashcards. Need help memorizing a concept?', '/dashboard': 'Let me help plan your study session. What subjects are you focusing on?', '/profile': 'You can track your progress here. Want to see your improvement areas?' }[currentRoute] || 'How can I assist you with your studies today?';
          }

          setAiMessages(prev => [...prev, { sender: 'ai', text: aiReply }]);
          setIsAiTyping(false);
        }, 600);
      };

      const isAuthPage = currentRoute === '/login' || currentRoute === '/signup';

      return (
        <div className="min-h-screen flex flex-col justify-between relative bg-bgMain dark:bg-slate-900 transition-colors">
          {!isAuthPage && (
            <Navbar
              currentRoute={currentRoute}
              navigate={navigate}
              user={user}
              isDarkMode={isDarkMode}
              setIsDarkMode={setIsDarkMode}
              handleLogout={handleLogout}
            />
          )}

          <main className={`flex-1 ${!isAuthPage ? 'pt-20 pb-16 max-w-[1440px] mx-auto px-8 w-full' : 'flex items-center justify-center py-12'}`}>
            {currentRoute === '/login' && <LoginScreen navigate={navigate} setUser={setUser} setIsAuthenticatedState={setIsAuthenticatedState} />}
            {currentRoute === '/signup' && <SignUpScreen navigate={navigate} setUser={setUser} setIsAuthenticatedState={setIsAuthenticatedState} />}
            {currentRoute === '/dashboard' && <DashboardScreen navigate={navigate} startQuiz={startQuiz} user={user} isDarkMode={isDarkMode} />}
            {currentRoute === '/quizzes' && <QuizzesScreen navigate={navigate} startQuiz={startQuiz} />}
            {currentRoute === '/quiz/7' && (
              <QuizInProgressScreen
                navigate={navigate}
                quiz={selectedQuiz}
                activeIdx={activeQuestionIdx}
                setActiveIdx={setActiveQuestionIdx}
                userAnswers={userAnswers}
                setUserAnswers={setUserAnswers}
                flaggedQuestions={flaggedQuestions}
                setFlaggedQuestions={setFlaggedQuestions}
                submitQuiz={submitQuiz}
              />
            )}
            {currentRoute === '/quiz/results' && (
              <QuizResultsScreen
                navigate={navigate}
                results={quizResults}
                startQuiz={startQuiz}
                quiz={selectedQuiz}
              />
            )}
            {currentRoute === '/flashcards' && (
              <FlashcardsCreateScreen
                navigate={navigate}
                flashcardDecks={flashcardDecks}
                setFlashcardDecks={setFlashcardDecks}
                setCurrentDeck={setCurrentDeck}
              />
            )}
            {currentRoute === '/flashcard-study' && (
              <FlashcardStudyScreen
                navigate={navigate}
                currentDeck={currentDeck}
                setCurrentDeck={setCurrentDeck}
                flashcardDecks={flashcardDecks}
                setFlashcardDecks={setFlashcardDecks}
                deckCardIndex={deckCardIndex}
                setDeckCardIndex={setDeckCardIndex}
              />
            )}
            {currentRoute === '/profile' && (
              <ProfileScreen
                navigate={navigate}
                user={user}
                setUser={setUser}
                isDarkMode={isDarkMode}
                setIsDarkMode={setIsDarkMode}
                quizHistory={quizHistory}
                flashcardDecks={flashcardDecks}
                handleLogout={handleLogout}
                activeTab={profileTab}
              />
            )}
          </main>

          {/* Floating AI Bot Assistant Trigger */}
          {!isAuthPage && (
            <div className="fixed bottom-16 right-8 z-40">
              <BotAvatar onClick={() => setIsAiChatOpen(!isAiChatOpen)} />
            </div>
          )}

          {/* AI Tutor Drawer / Chat Modal */}
          {isAiChatOpen && (
            <div className="fixed bottom-28 right-8 w-96 bg-white dark:bg-slate-800 rounded-card shadow-2xl border border-slate-200 dark:border-slate-700 z-50 flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-5 duration-200">
              <div className="bg-primary dark:bg-slate-900 text-white p-4 flex justify-between items-center">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full overflow-hidden bg-[#0a1628] border border-slate-600 flex-shrink-0">
                    <img src="bot_avatar.png" alt="ReviseSphere AI Bot" className="w-full h-full object-cover" />
                  </div>
                  <div>
                    <h3 className="font-bold text-sm leading-none">ReviseSphere AI Assistant</h3>
                    <span className="text-[10px] text-emerald-400 font-semibold">Online • Ready to help</span>
                  </div>
                </div>
                <button onClick={() => setIsAiChatOpen(false)} className="text-slate-300 hover:text-white font-bold text-lg">✕</button>
              </div>

              <div className="p-4 h-72 overflow-y-auto custom-scrollbar space-y-3 bg-slate-50 dark:bg-slate-900/50">
                {aiMessages.map((m, idx) => (
                  <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[80%] rounded-xl p-3 text-xs leading-relaxed ${m.sender === 'user' ? 'bg-primary dark:bg-indigo-600 text-white rounded-br-none' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 rounded-bl-none shadow-sm'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {isAiTyping && <div className="flex justify-start"><div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-3 text-xs flex items-center gap-1"><span className="animate-bounce">●</span><span className="animate-bounce delay-100">●</span><span className="animate-bounce delay-200">●</span></div></div>}
              </div>

              <div className="p-2 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 space-y-2">
                <div className="flex gap-1 overflow-x-auto pb-1 text-[10px]">
                  <button onClick={() => handleSendMessage("Explain Krebs Cycle")} className="whitespace-nowrap bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded hover:bg-slate-200 text-slate-700 dark:text-slate-200">💡 Krebs Cycle</button>
                  <button onClick={() => handleSendMessage("Stoichiometry tip")} className="whitespace-nowrap bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded hover:bg-slate-200 text-slate-700 dark:text-slate-200">💡 Stoichiometry</button>
                  <button onClick={() => handleSendMessage("Study advice")} className="whitespace-nowrap bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded hover:bg-slate-200 text-slate-700 dark:text-slate-200">💡 Active Recall</button>
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Ask AI anything..."
                    value={chatInput}
                    onChange={(e) => setChatInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                    className="flex-1 px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs focus:outline-none focus:border-primary"
                  />
                  <button onClick={() => handleSendMessage()} className="bg-primary dark:bg-indigo-600 text-white px-3 py-2 rounded-btn text-xs font-bold hover:bg-opacity-90">Send</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function Navbar({ currentRoute, navigate, user, isDarkMode, setIsDarkMode, handleLogout }) {
      const [isProfileMenuOpen, setIsProfileMenuOpen] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const menuRef = useRef(null);

      useEffect(() => {
        const updateOnlineState = () => setIsOnline(navigator.onLine);
        window.addEventListener('online', updateOnlineState);
        window.addEventListener('offline', updateOnlineState);
        return () => { window.removeEventListener('online', updateOnlineState); window.removeEventListener('offline', updateOnlineState); };
      }, []);

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (menuRef.current && !menuRef.current.contains(event.target)) {
            setIsProfileMenuOpen(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      return (
        <header className="fixed top-0 left-0 right-0 h-16 bg-primary dark:bg-slate-950 text-white z-40 border-b border-slate-800 shadow-md transition-colors">
          <div className="max-w-[1440px] mx-auto px-8 h-full flex items-center justify-between">
            <div onClick={() => navigate('/dashboard')}>
              <NavbarLogo />
            </div>

            <nav className="flex gap-8 items-center font-medium text-sm">
              <button
                onClick={() => navigate('/dashboard')}
                className={`py-5 border-b-2 transition-colors ${currentRoute === '/dashboard' ? 'border-accent text-white font-semibold' : 'border-transparent text-slate-300 hover:text-white'}`}
              >
                Home
              </button>
              <button
                onClick={() => navigate('/quizzes')}
                className={`py-5 border-b-2 transition-colors ${currentRoute.startsWith('/quiz') ? 'border-accent text-white font-semibold' : 'border-transparent text-slate-300 hover:text-white'}`}
              >
                Quizzes
              </button>
              <button
                onClick={() => navigate('/flashcards')}
                className={`py-5 border-b-2 transition-colors ${currentRoute.startsWith('/flashcard') ? 'border-accent text-white font-semibold' : 'border-transparent text-slate-300 hover:text-white'}`}
              >
                Flashcards
              </button>
              <button
                onClick={() => navigate('/profile')}
                className={`py-5 border-b-2 transition-colors ${currentRoute === '/profile' ? 'border-accent text-white font-semibold' : 'border-transparent text-slate-300 hover:text-white'}`}
              >
                Profile
              </button>
            </nav>
            {!isOnline && <span className="text-[10px] text-amber-400 bg-amber-950/50 px-2 py-0.5 rounded-full border border-amber-700">📶 Offline Mode</span>}

            <div className="flex items-center gap-4 relative" ref={menuRef}>
              <button
                onClick={() => setIsDarkMode(!isDarkMode)}
                className="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-amber-300 transition-all text-xs"
                title="Toggle Light/Dark Theme"
              >
                {isDarkMode ? '☀️ Light' : '🌙 Dark'}
              </button>

              <button
                onClick={() => navigate('/flashcards')}
                className="bg-accentBtn text-primary font-semibold text-xs px-4 py-2 rounded-btn hover:bg-opacity-90 transition-all flex items-center gap-1.5 shadow-sm"
              >
                <span className="text-base font-bold">+</span> New Deck
              </button>

              {/* Profile Avatar Button */}
              <button
                onClick={() => setIsProfileMenuOpen(!isProfileMenuOpen)}
                className="w-8 h-8 rounded-full flex items-center justify-center cursor-pointer hover:ring-2 ring-accent transition-all focus:outline-none"
                title={user ? user.name : 'User'}
              >
                <UserAvatar user={user} size="w-8 h-8" fontSize="text-xs" />
              </button>

              {/* Profile Dropdown Menu */}
              {isProfileMenuOpen && (
                <div className="absolute right-0 top-12 w-60 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50 animate-in fade-in duration-150">
                  <div className="px-4 py-3 border-b border-slate-100 dark:border-slate-700 flex items-center gap-3">
                    <UserAvatar user={user} size="w-9 h-9" fontSize="text-xs" />
                    <div className="overflow-hidden">
                      <p className="font-bold text-xs truncate text-primary dark:text-white">{user ? user.name : 'User'}</p>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 truncate">{user ? user.email : ''}</p>
                    </div>
                  </div>

                  <div className="py-1">
                    <button
                      onClick={() => { setIsProfileMenuOpen(false); navigate('/profile'); }}
                      className="w-full px-4 py-2 text-left text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 flex items-center gap-2.5 transition-colors"
                    >
                      <span className="text-sm">👤</span> Profile
                    </button>
                    <button
                      onClick={() => { setIsProfileMenuOpen(false); navigate('/profile', { tab: 'settings' }); }}
                      className="w-full px-4 py-2 text-left text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60 flex items-center gap-2.5 transition-colors"
                    >
                      <span className="text-sm">⚙️</span> Settings
                    </button>
                  </div>

                  <div className="border-t border-slate-100 dark:border-slate-700 pt-1">
                    <button
                      onClick={() => { setIsProfileMenuOpen(false); handleLogout(); }}
                      className="w-full px-4 py-2 text-left text-xs font-bold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/50 flex items-center gap-2.5 transition-colors"
                    >
                      <span className="text-sm">🚪</span> Logout
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    }

    function LoginScreen({ navigate, setUser, setIsAuthenticatedState }) {
      const [emailInput, setEmailInput] = useState('amara.okeke@stanford.edu');
      const [passInput, setPassInput] = useState('••••••••••••');
      const [forgotModalOpen, setForgotModalOpen] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSent, setForgotSent] = useState(false);

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        const loggedInUser = window.ReviseAuth
          ? window.ReviseAuth.loginUser(emailInput, passInput)
          : { name: emailInput ? emailInput.split('@')[0] : 'User', email: emailInput };
        Promise.resolve(loggedInUser).then((resolvedUser) => { setUser(resolvedUser); if (setIsAuthenticatedState) setIsAuthenticatedState(true); navigate('/dashboard'); }).catch(() => {});
      };

      const handleGuestLogin = () => {
        const guestUser = {
          name: 'Guest Student',
          email: 'guest@revisesphere.edu',
          isPro: false,
          avatarUrl: DEFAULT_AVATAR_URL
        };
        if (window.ReviseAuth) window.ReviseAuth.setAuthUser(guestUser);
        setUser(guestUser);
        if (setIsAuthenticatedState) setIsAuthenticatedState(true);
        navigate('/dashboard');
      };

      const handleSendResetLink = (e) => {
        e.preventDefault();
        if (!forgotEmail) return;
        setForgotSent(true);
        setTimeout(() => {
          setForgotSent(false);
          setForgotModalOpen(false);
          setForgotEmail('');
        }, 3000);

            {/* Left Banner */}
            <div className="w-full md:w-5/12 bg-primary dark:bg-slate-950 p-8 md:p-12 text-white flex flex-col justify-center items-center text-center relative border-b md:border-b-0 md:border-r border-slate-800">
              <div className="mb-6 bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-800">
                <LogoIcon />
              </div>
              <h1 className="text-3xl font-extrabold mb-3 tracking-tight text-white">Welcome!</h1>
              <p className="text-slate-300 text-sm leading-relaxed max-w-xs">
                Unlock your ReviseSphere workspace to master your upcoming exams with AI tools.
              </p>
            </div>

            {/* Right Form Container */}
            <div className="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center bg-white dark:bg-slate-800">
              <div className="max-w-md mx-auto w-full space-y-6">
                <div className="bg-slate-100 dark:bg-slate-700/60 p-1 rounded-lg flex">
                  <button className="flex-1 py-2.5 text-xs font-bold rounded-md bg-primary dark:bg-indigo-600 text-white shadow">
                    Log In
                  </button>
                  <button
                    onClick={() => navigate('/signup')}
                    className="flex-1 py-2.5 text-xs font-semibold rounded-md text-slate-500 dark:text-slate-300 hover:text-slate-800 dark:hover:text-white transition-colors"
                  >
                    Sign Up
                  </button>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Email or Username
                    </label>

    function StudyHoursChart({ isDarkMode }) {
      const days = [
        { key: 'Mon', name: 'Monday' },
        { key: 'Tue', name: 'Tuesday' },
        { key: 'Wed', name: 'Wednesday' },
        { key: 'Thu', name: 'Thursday' },
        { key: 'Fri', name: 'Friday' },
        { key: 'Sat', name: 'Saturday' },
        { key: 'Sun', name: 'Sunday' }
      ];
      const storageKey = 'revisesphere-study-hours';
      // Keep one entry for every weekday so days with no sessions still render as 0h.
      const defaultHours = [
        { day: 'Mon', hours: 1.5 }, { day: 'Tue', hours: 2.5 },
        { day: 'Wed', hours: 0 }, { day: 'Thu', hours: 3 },
        { day: 'Fri', hours: 2 }, { day: 'Sat', hours: 0 },
        { day: 'Sun', hours: 1 }
      ];
      const [studyHours, setStudyHours] = useState(() => {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey));
          return Array.isArray(saved) ? saved : defaultHours;
        } catch (error) {
          return defaultHours;
        }
      });
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [sessionHours, setSessionHours] = useState('1');
      const [sessionDate, setSessionDate] = useState(() => new Date().toISOString().slice(0, 10));

      // Persist every chart update so logged sessions survive a page reload.
      useEffect(() => {
        localStorage.setItem(storageKey, JSON.stringify(studyHours));
      }, [studyHours]);

      const chartData = days.map((day) => ({
        ...day,
        hours: Number(studyHours.find((entry) => entry.day === day.key)?.hours || 0)
      }));
      const totalHours = chartData.reduce((total, entry) => total + entry.hours, 0);
      const maxHours = Math.max(...chartData.map((entry) => entry.hours), 0);
      const yAxisMax = Math.max(5, Math.ceil(maxHours));
      const yAxisTicks = Array.from({ length: yAxisMax + 1 }, (_, index) => index);

      const handleLogSession = async (event) => {
        event.preventDefault();
        const hours = Number(sessionHours);
        if (!sessionDate || !Number.isFinite(hours) || hours <= 0) return;
        const date = new Date(`${sessionDate}T12:00:00`);
        const dayIndex = date.getDay() === 0 ? 6 : date.getDay() - 1;
        const loggedDay = days[dayIndex];
        const updatedHours = studyHours.map((entry) => (
          entry.day === loggedDay.key ? { ...entry, hours: Number((entry.hours + hours).toFixed(2)) } : entry
        ));
        setStudyHours(updatedHours);
        const authUser = window.ReviseAuth ? window.ReviseAuth.getAuthUser() : null;
        if (authUser && authUser.uid && window.firebase && typeof firebase.firestore === 'function') {
          try { await firebase.firestore().collection('studyHours').doc(authUser.uid).set({ hours: updatedHours, lastUpdated: new Date().toISOString() }); } catch (error) { console.error('Failed to sync to cloud:', error); }
        }
        setIsFormOpen(false);
        setSessionHours('1');
      };

      const renderTooltip = ({ active, payload }) => {
        if (!active || !payload || !payload.length) return null;
        const entry = payload[0].payload;
        return <div className="bg-slate-900 text-white px-3 py-2 rounded-lg shadow-lg text-xs font-semibold" role="status">{entry.name}: {entry.hours} hours</div>;
      };

      return (
        <section className="bg-white dark:bg-slate-800 rounded-card p-4 sm:p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4" aria-label="Study hours per day tracker">
          <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
            <div>
              <h2 className="font-extrabold text-base text-primary dark:text-white">Study Hours per Day</h2>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Your weekly study duration at a glance.</p>
            </div>
            <div className="flex items-center justify-between sm:justify-end gap-4">
              <div className="text-left sm:text-right"><span className="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total this week</span><strong className="text-xl text-primary dark:text-white">{totalHours.toFixed(1)}h</strong></div>
              <button type="button" onClick={() => setIsFormOpen(!isFormOpen)} aria-expanded={isFormOpen} aria-controls="study-session-form" className="bg-accentBtn text-primary font-bold text-xs px-3 py-2 rounded-btn hover:bg-opacity-90 transition-all shadow-sm whitespace-nowrap">+ Log Study Session</button>
            </div>
          </div>

          {isFormOpen && (
            <form id="study-session-form" onSubmit={handleLogSession} className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-3 p-4 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-200 dark:border-slate-700" aria-label="Log study session form">
              <label className="text-xs font-bold text-slate-700 dark:text-slate-300">Hours<input type="number" min="0.25" step="0.25" value={sessionHours} onChange={(event) => setSessionHours(event.target.value)} aria-label="Study hours" className="mt-1 w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white rounded-btn font-normal" required /></label>
              <label className="text-xs font-bold text-slate-700 dark:text-slate-300">Date<input type="date" value={sessionDate} onChange={(event) => setSessionDate(event.target.value)} aria-label="Study session date" className="mt-1 w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white rounded-btn font-normal" required /></label>
              <button type="submit" className="self-end bg-primary dark:bg-indigo-600 text-white px-4 py-2 rounded-btn text-xs font-bold hover:bg-opacity-95">Save Session</button>
            </form>
          )}

          <div className="h-64 sm:h-72 w-full" role="img" aria-label={`Bar chart showing ${totalHours.toFixed(1)} total study hours this week`}>
            <ResponsiveContainer width="100%" height="100%">
              <BarChart data={chartData} margin={{ top: 22, right: 8, left: 0, bottom: 18 }}>
                <XAxis dataKey="key" stroke={isDarkMode ? '#CBD5E1' : '#475569'} fontSize={12} tickLine={false} axisLine={false} label={{ value: 'Day', position: 'insideBottom', offset: -8, fill: isDarkMode ? '#CBD5E1' : '#475569', fontSize: 12 }} />
                <YAxis domain={[0, yAxisMax]} ticks={yAxisTicks} stroke={isDarkMode ? '#CBD5E1' : '#475569'} fontSize={11} tickLine={false} axisLine={false} label={{ value: 'Hours', angle: -90, position: 'insideLeft', fill: isDarkMode ? '#CBD5E1' : '#475569', fontSize: 12 }} />
                <Tooltip content={renderTooltip} cursor={{ fill: isDarkMode ? '#334155' : '#F1F5F9' }} />
                <Bar dataKey="hours" radius={[4, 4, 0, 0]} maxBarSize={48}>
                  <LabelList dataKey="hours" position="top" formatter={(value) => `${value}h`} fill={isDarkMode ? '#F8FAFC' : '#1E293B'} fontSize={11} fontWeight={700} />
                  {chartData.map((entry) => <Cell key={entry.key} fill={entry.hours > 0 ? (isDarkMode ? '#F59E0B' : '#D97706') : (isDarkMode ? '#475569' : '#CBD5E1')} />)}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div className="flex flex-wrap gap-4 text-[11px] font-semibold text-slate-500 dark:text-slate-400" aria-label="Chart legend">
            <span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-amber-600"></span>Studied</span>
            <span className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm bg-slate-300 dark:bg-slate-600"></span>No study logged</span>
          </div>
        </section>
      );
    }

    function RevisionScheduler() {
      const [examSubjects, setExamSubjects] = useState(() => {
        try { return JSON.parse(localStorage.getItem('rs-exam-subjects')) || [
          { id: '1', name: 'Biology', examDate: '2026-09-15', difficulty: 5, priority: 'high' },
          { id: '2', name: 'Chemistry', examDate: '2026-09-20', difficulty: 4, priority: 'medium' },
          { id: '3', name: 'Physics', examDate: '2026-10-01', difficulty: 3, priority: 'low' }
        ]; } catch (error) { return []; }
      });
      const [showAddSubject, setShowAddSubject] = useState(false);
      const [newSubjectName, setNewSubjectName] = useState('');
      const [newExamDate, setNewExamDate] = useState('');
      const [newDifficulty, setNewDifficulty] = useState(3);

      useEffect(() => { localStorage.setItem('rs-exam-subjects', JSON.stringify(examSubjects)); }, [examSubjects]);
      const calculateDailyHours = (examDate, difficulty) => {
        const daysLeft = Math.max(1, Math.ceil((new Date(examDate) - new Date()) / 86400000));
        return Math.max(0.5, Math.round((difficulty * 2) / daysLeft * 10) / 10);
      };
      const sortedSubjects = [...examSubjects].sort((a, b) => new Date(a.examDate) - new Date(b.examDate));
      const addSubject = () => {
        if (!newSubjectName || !newExamDate) return;
        setExamSubjects([...examSubjects, { id: Date.now().toString(), name: newSubjectName, examDate: newExamDate, difficulty: newDifficulty, priority: newDifficulty >= 4 ? 'high' : newDifficulty >= 3 ? 'medium' : 'low' }]);
        setNewSubjectName(''); setNewExamDate(''); setNewDifficulty(3); setShowAddSubject(false);
      };
      const priorityClasses = { high: 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300', medium: 'bg-yellow-100 text-yellow-700 dark:bg-yellow-950 dark:text-yellow-300', low: 'bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-300' };
      return <section className="bg-white dark:bg-slate-800 rounded-card p-4 sm:p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
        <div className="flex justify-between items-center"><h3 className="font-extrabold text-sm text-primary dark:text-white">📅 Revision Schedule</h3><button onClick={() => setShowAddSubject(true)} className="bg-accentBtn text-primary px-3 py-2 rounded-btn text-xs font-bold hover:bg-opacity-90 transition-all">➕ Add Subject</button></div>
        <div className="space-y-2">{sortedSubjects.map(subject => <div key={subject.id} className="flex flex-wrap items-center justify-between gap-3 bg-slate-50 dark:bg-slate-900 p-3 rounded-xl border border-slate-100 dark:border-slate-700"><div><div className="text-xs font-bold text-primary dark:text-white">{subject.name}</div><div className="text-[11px] text-slate-500 dark:text-slate-400">Exam: {subject.examDate} · {calculateDailyHours(subject.examDate, subject.difficulty)}h/day</div></div><span className={`text-[10px] font-extrabold uppercase px-2 py-1 rounded ${priorityClasses[subject.priority]}`}>{subject.priority}</span></div>)}</div>
        {showAddSubject && <div className="border-t border-slate-200 dark:border-slate-700 pt-4 space-y-3"><div className="grid sm:grid-cols-2 gap-3"><input value={newSubjectName} onChange={e => setNewSubjectName(e.target.value)} placeholder="Subject Name" className="p-2 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs" /><input type="date" value={newExamDate} onChange={e => setNewExamDate(e.target.value)} className="p-2 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs" /></div><label className="block text-xs font-semibold text-slate-600 dark:text-slate-400">Difficulty: {newDifficulty}<input type="range" min="1" max="5" value={newDifficulty} onChange={e => setNewDifficulty(Number(e.target.value))} className="w-full" /></label><div className="flex gap-2"><button onClick={addSubject} className="bg-primary text-white px-4 py-2 rounded-btn text-xs font-bold">Save Subject</button><button onClick={() => setShowAddSubject(false)} className="text-slate-500 px-4 py-2 text-xs font-semibold">Cancel</button></div></div>}

    const PomodoroTimer = React.memo(function PomodoroTimer() {
      const [mode, setMode] = useState('focus');
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [sessionsCompleted, setSessionsCompleted] = useState(0);
      const duration = mode === 'focus' ? 25 : mode === 'break' ? 5 : 15;
      useEffect(() => {
        if (!isRunning) return undefined;
        if (timeLeft <= 0) {
          const nextCount = mode === 'focus' ? sessionsCompleted + 1 : sessionsCompleted;
          const nextMode = mode === 'focus' ? (nextCount % 4 === 0 ? 'longBreak' : 'break') : 'focus';
          if (mode === 'focus') setSessionsCompleted(nextCount);
          setMode(nextMode); setTimeLeft(nextMode === 'focus' ? 25 * 60 : nextMode === 'break' ? 5 * 60 : 15 * 60); setIsRunning(false);
          if (mode === 'focus' && window.ReviseFX) window.ReviseFX.triggerConfetti();
          return undefined;
        }
        const timer = setInterval(() => setTimeLeft(value => value - 1), 1000);
        return () => clearInterval(timer);
      }, [isRunning, timeLeft, mode, sessionsCompleted]);
      const reset = () => { setTimeLeft(duration * 60); setIsRunning(false); };
      return <section className="bg-white dark:bg-slate-800 rounded-card p-4 sm:p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4 text-center"><h3 className="font-extrabold text-sm text-primary dark:text-white">⏱️ Pomodoro Focus Timer</h3><div className="relative mx-auto w-36 h-36 flex items-center justify-center"><svg className="absolute w-full h-full -rotate-90" viewBox="0 0 36 36"><path className="text-slate-100 dark:text-slate-700" stroke="currentColor" strokeWidth="3" fill="none" d="M18 2.5a15.5 15.5 0 1 1 0 31a15.5 15.5 0 1 1 0-31" /><path className="text-emerald-500" stroke="currentColor" strokeWidth="3" strokeLinecap="round" fill="none" strokeDasharray={`${(timeLeft / (duration * 60)) * 100}, 100`} d="M18 2.5a15.5 15.5 0 1 1 0 31a15.5 15.5 0 1 1 0-31" /></svg><span className="text-3xl font-black text-primary dark:text-white">{String(Math.floor(timeLeft / 60)).padStart(2, '0')}:{String(timeLeft % 60).padStart(2, '0')}</span></div><div className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-600 dark:text-emerald-400">{mode === 'longBreak' ? 'Long Break' : mode}</div><div className="flex justify-center gap-2"><button onClick={() => setIsRunning(!isRunning)} className="bg-primary text-white px-4 py-2 rounded-btn text-xs font-bold">{isRunning ? 'Pause' : 'Start'}</button><button onClick={reset} className="border border-borderClr dark:border-slate-700 px-4 py-2 rounded-btn text-xs font-semibold text-slate-700 dark:text-slate-200">Reset</button></div><div className="text-xs text-slate-500 dark:text-slate-400">🍅 x{sessionsCompleted}</div></section>;
    });

            <div className="bg-primary dark:bg-slate-800 text-white rounded-card p-8 flex flex-col justify-between shadow-xl hover:shadow-2xl transition-all border border-slate-800 dark:border-slate-700">

                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>

          <div className="max-w-5xl mx-auto bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm flex items-center justify-between">
            <div className="flex items-center gap-4">
              <img src="logo_icon.png" alt="Icon" className="w-10 h-10 object-contain" />
              <div>
                <h4 className="font-extrabold text-sm text-primary dark:text-indigo-400">Quick Start Revision Session</h4>

            <button

        </div>

            <div className="flex items-center gap-4">

                <img src="logo_icon.png" alt="Icon" className="w-full h-full object-contain" />

              <div>
                <div className="text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider">OVERALL MASTERY:</div>

                <div className="text-[10px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider">AVERAGE SCORE:</div>

              <div className="space-y-3">

                    { label: 'History', val: 'HISTORY' },

              <div className="pt-2 space-y-3 border-t border-slate-100 dark:border-slate-700">

            <div className="flex-1 space-y-4">

                <h2 className="text-xl font-extrabold text-primary dark:text-white">Available Topics &amp; Practice Quizzes</h2>

                      </div>

    const saveQuizProgress = (quizId, answers, flagged, activeIdx) => {
      try { localStorage.setItem(`quiz_progress_${quizId}`, JSON.stringify({ answers, flagged, activeIdx, timestamp: Date.now() })); } catch (error) { /* Storage may be unavailable in private browsing. */ }
    };
    const loadQuizProgress = (quizId) => {
      try {
        const saved = JSON.parse(localStorage.getItem(`quiz_progress_${quizId}`));
        return saved && Date.now() - saved.timestamp < 24 * 60 * 60 * 1000 ? saved : null;
      } catch (error) { return null; }
    };
    const cacheDeck = (deck) => {
      try { localStorage.setItem(`cached_deck_${deck.id}`, JSON.stringify(deck)); } catch (error) { /* Offline cache is best effort. */ }
    };
    const loadCachedDeck = (deckId) => {
      try { return JSON.parse(localStorage.getItem(`cached_deck_${deckId}`)); } catch (error) { return null; }
    };

    function QuizInProgressScreen({
      navigate,
      quiz,
      activeIdx,
      setActiveIdx,
      userAnswers,
      setUserAnswers,
      flaggedQuestions,
      setFlaggedQuestions,
      submitQuiz
    }) {
      const currentQ = quiz.questions[activeIdx];
      const ansKey = `${quiz.id}_q${currentQ.id}`;
      const selectedOption = userAnswers[ansKey] || null;
      const isFlagged = !!flaggedQuestions[ansKey];

      const initialSeconds = (quiz ? quiz.timeMinutes : 15) * 60;
      const [timeLeft, setTimeLeft] = useState(initialSeconds);
      const [isTimerPaused, setIsTimerPaused] = useState(false);
      const [showTimeWarning, setShowTimeWarning] = useState(false);

      // Keep a stable ref to submitQuiz to avoid stale closure inside the interval
      const submitQuizRef = useRef(submitQuiz);
      useEffect(() => { submitQuizRef.current = submitQuiz; }, [submitQuiz]);

      useEffect(() => {
        setTimeLeft(quiz ? quiz.timeMinutes * 60 : 900);
        setIsTimerPaused(false);
        setShowTimeWarning(false);
      }, [quiz]);

      useEffect(() => {
        if (!quiz) return;
        const saved = loadQuizProgress(quiz.id);
        if (saved) {
          setUserAnswers(saved.answers || {});
          setFlaggedQuestions(saved.flagged || {});
          setActiveIdx(saved.activeIdx || 0);
        }
      }, [quiz]);

      useEffect(() => {
        if (quiz) saveQuizProgress(quiz.id, userAnswers, flaggedQuestions, activeIdx);
      }, [userAnswers, flaggedQuestions, activeIdx, quiz]);

      useEffect(() => {
        // Only depend on isTimerPaused — NOT timeLeft — to avoid creating a new
        // interval on every tick (which would cause the timer to speed up).
        if (isTimerPaused) return;

        const timerId = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev === 120) {
              setShowTimeWarning(true);
            }
            if (prev <= 1) {
              clearInterval(timerId);
              setTimeout(() => submitQuizRef.current(), 100);
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerId);
      }, [isTimerPaused]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleAddMinute = () => {
        setTimeLeft(prev => prev + 60);
      };

      const handleResetTimer = () => {
        setTimeLeft(initialSeconds);
        setIsTimerPaused(false);
      };

      const handleSelectOption = (optId) => {
        setUserAnswers({
          ...userAnswers,
          [ansKey]: optId
        });
      };

      const handleToggleFlag = () => {
        setFlaggedQuestions({
          ...flaggedQuestions,
          [ansKey]: !isFlagged
        });
      };

      const currentQuizAnswered = quiz.questions.filter(q => !!userAnswers[`${quiz.id}_q${q.id}`]).length;
      const progressPercent = Math.round(((activeIdx + 1) / quiz.questions.length) * 100);

      return (
        <div className="flex gap-8 items-start pt-4 pb-12">
          <div className="w-60 bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm flex-shrink-0 space-y-6">
            <h3 className="font-extrabold text-sm text-primary dark:text-indigo-400">Question Navigator</h3>

            <div className="grid grid-cols-5 gap-2">
              {quiz.questions.map((q, idx) => {
                const qKey = `${quiz.id}_q${q.id}`;
                const isCurrent = idx === activeIdx;
                const isAns = !!userAnswers[qKey];
                const isFlag = !!flaggedQuestions[qKey];

                let bgClass = "bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300";
                if (isAns) bgClass = "bg-accentBtn border-accent text-primary font-bold dark:bg-emerald-950 dark:text-emerald-300 dark:border-emerald-700";
                if (isFlag) bgClass = "bg-amber-100 border-amber-300 text-amber-800 font-bold dark:bg-amber-950 dark:text-amber-300";
                if (isCurrent) bgClass = "border-2 border-primary dark:border-indigo-400 text-primary dark:text-white font-extrabold bg-white dark:bg-slate-800 ring-2 ring-primary/20 shadow-sm";

                return (
                  <button
                    key={q.id}
                    onClick={() => setActiveIdx(idx)}
                    className={`h-9 rounded-btn text-xs flex items-center justify-center transition-all ${bgClass}`}
                  >
                    {idx + 1}
                  </button>
                );
              })}
            </div>

            <div className="space-y-2.5 pt-4 border-t border-slate-100 dark:border-slate-700 text-[11px] text-slate-500 dark:text-slate-400 font-medium">
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded bg-accentBtn border border-accent inline-block"></span>
                <span>Answered ({currentQuizAnswered})</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded bg-amber-100 border border-amber-300 inline-block"></span>
                <span>Flagged ({Object.keys(flaggedQuestions).filter(k => k.startsWith(quiz.id) && flaggedQuestions[k]).length})</span>
              </div>
              <div className="flex items-center gap-2">
                <span className="w-3 h-3 rounded bg-slate-50 border border-slate-200 inline-block"></span>
                <span>Unanswered ({quiz.questions.length - currentQuizAnswered})</span>
              </div>
            </div>

            {/* Timer Utility Box */}
            <div className="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-2">
              <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">TIMER CONTROLS</div>
              <div className="flex gap-2 text-xs">
                <button
                  onClick={handleAddMinute}
                  className="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 py-1.5 rounded-md font-semibold text-[11px] border border-slate-200 dark:border-slate-600 transition-colors"
                >
                  +1 Min
                </button>
                <button
                  onClick={handleResetTimer}
                  className="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 py-1.5 rounded-md font-semibold text-[11px] border border-slate-200 dark:border-slate-600 transition-colors"
                >
                  Reset
                </button>
              </div>
            </div>
          </div>

          <div className="flex-1 space-y-6">
            <div className="bg-white dark:bg-slate-800 rounded-card p-4 border border-borderClr dark:border-slate-700 shadow-sm flex items-center justify-between px-8">
              <div className="flex items-center gap-6 flex-1 mr-8">
                <span className="font-bold text-xs text-primary dark:text-indigo-300 whitespace-nowrap">Question {activeIdx + 1} of {quiz.questions.length}</span>
                <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                  <div className="bg-accent dark:bg-indigo-500 h-full rounded-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>

                ? 'bg-red-100 text-red-700 border-red-300 dark:bg-red-950 dark:text-red-300 animate-pulse'
                : timeLeft <= 180
                  ? 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950 dark:text-amber-300'
                  : 'bg-red-50 text-red-600 border-red-100 dark:bg-slate-700 dark:text-slate-200 dark:border-slate-600'

                <span>⏱️</span>
                <span className="font-mono text-sm tracking-wide">{formatTime(timeLeft)}</span>
                <button
                  onClick={() => setIsTimerPaused(!isTimerPaused)}

            {showTimeWarning && (
              <div className="bg-amber-100 dark:bg-amber-950 border border-amber-300 dark:border-amber-700 text-amber-900 dark:text-amber-200 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center justify-between">
                <span>⚠️ Less than 2 minutes remaining! Review your flagged answers before submitting.</span>
                <button onClick={() => setShowTimeWarning(false)} className="text-amber-800 dark:text-amber-300 font-bold hover:underline ml-4">Dismiss</button>

            <div className="bg-white dark:bg-slate-800 rounded-card p-8 border border-borderClr dark:border-slate-700 shadow-sm space-y-6">
              <div className="flex justify-between items-center">
                <div className="text-[10px] font-extrabold text-emerald-600 dark:text-emerald-400 tracking-wider uppercase">

                {isFlagged && (
                  <span className="bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded border border-amber-200 dark:border-amber-700">
                    🚩 Flagged for Review
                  </span>
                )}
              </div>

              <h2 className="text-base font-bold text-primary dark:text-white leading-relaxed">
                {currentQ.question}
              </h2>

              <div className="space-y-3 pt-2">
                {currentQ.options.map((opt) => {
                  const isSelected = selectedOption === opt.id;
                  return (
                    <div
                      key={opt.id}
                      onClick={() => handleSelectOption(opt.id)}
                      className={`p-4 rounded-card border transition-all cursor-pointer flex items-center gap-4 ${isSelected ? 'border-primary dark:border-indigo-400 bg-indigo-50/40 dark:bg-indigo-950/40 ring-1 ring-primary dark:ring-indigo-400' : 'border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-600'}`}
                    >
                      <div className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${isSelected ? 'bg-primary dark:bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                        {opt.id}
                      </div>
                      <span className="text-xs font-semibold text-slate-800 dark:text-slate-200">{opt.text}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex justify-between items-center pt-2">
              <button
                disabled={activeIdx === 0}
                onClick={() => setActiveIdx(activeIdx - 1)}
                className={`border border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-5 py-2.5 rounded-btn text-xs font-semibold flex items-center gap-1.5 ${activeIdx === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-50 dark:hover:bg-slate-700'}`}
              >
                <span>←</span> Previous Question
              </button>

              <div className="flex gap-4">
                <button
                  onClick={handleToggleFlag}
                  className={`border px-5 py-2.5 rounded-btn text-xs font-semibold flex items-center gap-1.5 transition-colors ${isFlagged ? 'bg-amber-50 text-amber-700 border-amber-300 dark:bg-amber-950 dark:text-amber-300 font-bold' : 'border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700'}`}
                >
                  🚩 {isFlagged ? 'Unflag Question' : 'Flag for Review'}
                </button>

                {activeIdx < quiz.questions.length - 1 ? (
                  <button
                    onClick={() => setActiveIdx(activeIdx + 1)}
                    className="bg-primary dark:bg-indigo-600 text-white px-6 py-2.5 rounded-btn text-xs font-bold hover:bg-opacity-95 shadow flex items-center gap-1.5"
                  >
                    Next Question <span>→</span>
                  </button>
                ) : (
                  <button
                    onClick={submitQuiz}
                    className="bg-emerald-600 text-white px-6 py-2.5 rounded-btn text-xs font-bold hover:bg-emerald-700 shadow flex items-center gap-1.5"
                  >
                    Finish &amp; Submit Quiz <span>✓</span>
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function QuizResultsScreen({ navigate, results, startQuiz, quiz }) {
      const activeResults = results || {
        quiz: quiz || QUIZ_DATABASE[1],
        userAnswers: { 'chem-1_q1': 'B', 'chem-1_q2': 'B', 'chem-1_q3': 'C', 'chem-1_q4': 'B', 'chem-1_q5': 'A' },
        correctCount: 5,
        total: 5,
        percent: 100,

      return (

            <div className="flex gap-4">

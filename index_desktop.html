              >
                🔄 Retry Quiz
              </button>
              <button
                onClick={() => navigate('/quizzes')}
                className="bg-primary dark:bg-indigo-600 text-white px-4 py-2 rounded-btn text-xs font-bold hover:bg-opacity-95 shadow flex items-center gap-1.5"
              >
                📚 Choose Another Topic
              </button>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-8">
            <div className="bg-white dark:bg-slate-800 rounded-card p-8 border border-borderClr dark:border-slate-700 shadow-sm flex items-center gap-8">
              <div className="relative w-32 h-32 flex items-center justify-center flex-shrink-0">
                <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                  <path className="text-slate-100 dark:text-slate-700" strokeWidth="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  <path className="text-primary dark:text-indigo-400" strokeDasharray={`${percent}, 100`} strokeWidth="3.5" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div className="absolute text-center">
                  <span className="text-2xl font-black text-primary dark:text-white block leading-none">{percent}%</span>
                  <span className="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Grade</span>
                </div>
              </div>

              <div className="space-y-2">
                <h3 className="text-lg font-extrabold text-primary dark:text-white">
                  {percent >= 70 ? 'Passed successfully! 🎉' : 'Keep practicing! 💪'}
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed font-medium">
                  You answered {correctCount} out of {total} questions correctly.
                </p>
                <div className="flex gap-4 pt-2 text-xs font-bold">
                  <span className="flex items-center gap-1.5 text-emerald-600 dark:text-emerald-400"><span className="w-2.5 h-2.5 rounded bg-emerald-500"></span> {correctCount} Correct</span>
                  <span className="flex items-center gap-1.5 text-red-500"><span className="w-2.5 h-2.5 rounded bg-red-500"></span> {total - correctCount} Incorrect</span>
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-800 rounded-card p-8 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
              <h3 className="font-extrabold text-sm text-primary dark:text-indigo-400">Breakdown by Topic</h3>

              <div className="space-y-3 pt-1">
                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span className="text-slate-700 dark:text-slate-300">{currentQuiz.category} Core Principles</span>
                    <span className="text-primary dark:text-indigo-400 font-bold">{percent}%</span>
                  </div>
                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div className="bg-accent dark:bg-indigo-500 h-full rounded-full" style={{ width: `${percent}%` }}></div>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between text-xs font-semibold mb-1">
                    <span className="text-slate-700 dark:text-slate-300">Problem Solving &amp; Application</span>
                    <span className="text-primary dark:text-indigo-400 font-bold">100%</span>
                  </div>
                  <div className="w-full bg-slate-100 dark:bg-slate-700 h-2 rounded-full overflow-hidden">
                    <div className="bg-accent dark:bg-indigo-500 h-full rounded-full" style={{ width: '100%' }}></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="space-y-4">
            <h3 className="font-extrabold text-base text-primary dark:text-white">Question &amp; Answer Review</h3>

            {currentQuiz.questions.map((q, idx) => {
              const uAns = userAnswers[`${currentQuiz.id}_q${q.id}`];
              const isCorrect = uAns === q.correctOption;
              const uAnsText = q.options.find(o => o.id === uAns)?.text || 'No answer selected';
              const correctText = q.options.find(o => o.id === q.correctOption)?.text;

              return (
                <div key={q.id} className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
                  <div className="flex justify-between items-center">
                    <div className="flex items-center gap-2">
                      <span className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${isCorrect ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-red-100 text-red-600 dark:bg-red-950 dark:text-red-300'}`}>
                        {isCorrect ? '✓' : '✕'}
                      </span>
                      <span className="font-bold text-xs text-primary dark:text-white">Question {idx + 1}</span>
                    </div>
                    <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded ${isCorrect ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300'}`}>
                      {isCorrect ? 'CORRECT' : 'INCORRECT'}
                    </span>
                  </div>
                  <p className="text-xs font-bold text-slate-800 dark:text-slate-200">{q.question}</p>

                  <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-lg space-y-1 text-xs border border-slate-100 dark:border-slate-700">
                    <div className={`font-semibold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-red-600 dark:text-red-400'}`}>
                      Your Answer: ({uAns || 'None'}) {uAnsText}
                    </div>
                    {!isCorrect && (
                      <div className="font-semibold text-emerald-700 dark:text-emerald-400 pt-1">
                        Correct Answer: ({q.correctOption}) {correctText}
                      </div>
                    )}
                    <div className="text-slate-600 dark:text-slate-300 pt-1">
                      <span className="font-bold text-slate-700 dark:text-slate-200">AI Explanation:</span> {q.explanation}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function FlashcardsCreateScreen({ navigate, flashcardDecks, setFlashcardDecks, setCurrentDeck }) {
      const [notesText, setNotesText] = useState("Cell biology notes: Cellular organelles are specialized structures within a cell that perform specific tasks. The mitochondria is known as the powerhouse because it performs cellular respiration to generate ATP. Ribosomes are the sites of protein synthesis...");
      const [deckSubject, setDeckSubject] = useState("BIOLOGY");
      const [deckTitle, setDeckTitle] = useState("Biology: Cell Organelles");
      const [isGenerating, setIsGenerating] = useState(false);
      const [saveStatus, setSaveStatus] = useState('');
      const [savedMessage, setSavedMessage] = useState(null);

      useEffect(() => {
        const sharedData = new URLSearchParams(window.location.search).get('sharedDeck');
        if (!sharedData) return;
        try {
          const decoded = JSON.parse(atob(sharedData));
          setDeckTitle(`${decoded.title} (Shared)`);
          setDeckSubject(decoded.subject);
          setEditableCards((decoded.cards || []).map((card, index) => ({ id: `shared-${index}`, front: card.front, back: card.back })));
        } catch (error) {
          console.error('Invalid shared deck');
        }
      }, []);

      const [editableCards, setEditableCards] = useState([
        { id: 'c1', front: "Mitochondria", back: "Powerhouse of the cell; produces ATP via cellular respiration." },
        { id: 'c2', front: "Ribosomes", back: "Protein synthesis machinery of the cell." },
        { id: 'c3', front: "Nucleolus", back: "Produces and assembles ribosomes in eukaryotic nucleus." },
        { id: 'c4', front: "Lysosome", back: "Contains hydrolytic enzymes to digest waste and macromolecules." }
      ]);

      const [editingCardId, setEditingCardId] = useState(null);
      const [editFrontText, setEditFrontText] = useState('');
      const [editBackText, setEditBackText] = useState('');

      const persistDeck = (startStudy = false) => {
        const cleanTitle = (deckTitle || '').trim() || 'Untitled Deck';
        const cleanSubject = deckSubject || 'General';
        const sanitizedCards = (Array.isArray(editableCards) ? editableCards : [])
          .map((card, index) => ({
            id: card.id || `card-${index}-${Date.now()}`,
            front: (card.front || '').trim() || `New Term ${index + 1}`,
            back: (card.back || '').trim() || 'Add a brief explanation.'
          }))
          .filter(card => card.front || card.back);

        if (!sanitizedCards.length) {
          setSaveStatus('Add at least one card before saving.');
          return;
        }

        const newDeckObj = {
          id: 'deck-' + Date.now(),
          title: cleanTitle,
          subject: cleanSubject,
          cards: sanitizedCards
        };

        setFlashcardDecks(prev => {
          const nextDecks = [newDeckObj, ...prev];
          try { localStorage.setItem('flashcard_decks', JSON.stringify(nextDecks)); } catch (error) { /* Ignore storage issues. */ }
          return nextDecks;
        });
        setCurrentDeck(newDeckObj);
        cacheDeck(newDeckObj);

        const savedAlert = 'Flashcard deck saved successfully! 💳✨';
        setSavedMessage(savedAlert);
        setTimeout(() => setSavedMessage(null), 3000);
        if (window.ReviseFX) {
          if (typeof window.ReviseFX.playSound === 'function') {
            window.ReviseFX.playSound('save');
          }
          if (typeof window.ReviseFX.showNotification === 'function') {
            window.ReviseFX.showNotification('Flashcard Deck Saved', savedAlert);
          }
        }

        setSaveStatus('Deck saved!');

        if (startStudy) {
          setSaveStatus('Deck saved! Opening study mode...');
          navigate('/flashcard-study');
          return;
        }
      };

      const handleGenerateDeck = (shouldStartStudy = false) => {
        setIsGenerating(true);
        setTimeout(() => {
          setIsGenerating(false);
          persistDeck(shouldStartStudy);
        }, 1200);
      };

      const handleAddCard = () => {
        setEditableCards(prev => {
          const nextCount = (Array.isArray(prev) ? prev.length : 0) + 1;
          return [...(Array.isArray(prev) ? prev : []), {
            id: 'c-' + Date.now(),
            front: "New Term " + nextCount,
            back: "Explanation / definition for term."
          }];
        });
      };

      const handleDeleteCard = (id) => {
        setEditableCards(prev => (Array.isArray(prev) ? prev.filter(c => c.id !== id) : []));
      };

      const handleStartRenameCard = (card) => {
        setEditingCardId(card.id);
        setEditFrontText(card.front);
        setEditBackText(card.back);
      };

      const handleSaveRenameCard = (cardId) => {
        setEditableCards(prev => (Array.isArray(prev) ? prev.map(c => c.id === cardId ? { ...c, front: editFrontText, back: editBackText } : c) : []));
        setEditingCardId(null);
      };

      return (
        <div className="space-y-6 pb-12">
          <div className="flex gap-8 items-start">
            <div className="w-[420px] bg-white dark:bg-slate-800 rounded-card p-8 border border-borderClr dark:border-slate-700 shadow-sm space-y-6 flex-shrink-0">
              {savedMessage && (
                <div className="bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 px-4 py-3 rounded-btn text-xs font-bold flex items-center gap-2 border border-emerald-200 dark:border-emerald-800 shadow-sm transition-all duration-300 animate-[fadeIn_0.25s_ease-out]" role="status" aria-live="polite">
                  <span>✓</span>
                  <span>{savedMessage}</span>
                </div>
              )}

              <div>
                <h2 className="text-lg font-extrabold text-primary dark:text-white mb-1 flex items-center gap-2">
                  <img src="logo_icon.png" alt="Icon" className="w-6 h-6 object-contain" />
                  Create New Flashcards
                </h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">Paste notes, select options, and let AI build customized learning decks.</p>
              </div>

              <div className="space-y-4">
                <div>
                  <label className="block text-[10px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">DECK TITLE</label>
                  <input
                    type="text"
                    value={deckTitle}
                    onChange={(e) => setDeckTitle(e.target.value)}
                    className="w-full p-2.5 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs font-semibold focus:outline-none focus:border-primary"
                  />
                </div>

                <div>
                  <label className="block text-[10px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">PASTE STUDY NOTES / SYLLABUS</label>
                  <textarea
                    rows="5"
                    value={notesText}
                    onChange={(e) => setNotesText(e.target.value)}
                    className="w-full p-3 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs focus:outline-none focus:border-primary leading-relaxed resize-none bg-slate-50/50 dark:bg-slate-900/50"
                  ></textarea>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[10px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">SUBJECT</label>
                    <select
                      value={deckSubject}
                      onChange={(e) => setDeckSubject(e.target.value)}
                      className="w-full p-2.5 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs font-semibold focus:outline-none focus:border-primary"
                    >
                      <option value="BIOLOGY">Biology</option>
                      <option value="CHEMISTRY">Chemistry</option>
                      <option value="PHYSICS">Physics</option>
                      <option value="MATHEMATICS">Mathematics</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[10px] font-extrabold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2">FOCUS AREA</label>
                    <select className="w-full p-2.5 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs font-semibold focus:outline-none focus:border-primary">
                      <option>Definitions</option>
                      <option>Processes</option>
                      <option>Key Formulas</option>
                    </select>
                  </div>
                </div>

                <button
                  onClick={() => handleGenerateDeck(false)}
                  disabled={isGenerating}
                  className="w-full bg-primary dark:bg-indigo-600 text-white py-3 rounded-btn font-bold text-xs hover:bg-opacity-95 shadow flex items-center justify-center gap-2"
                >
                  <span>✨</span> {isGenerating ? 'Generating Deck...' : 'Save Deck'}
                </button>

                <button
                  onClick={() => handleGenerateDeck(true)}
                  disabled={isGenerating}
                  className="w-full border border-primary/40 bg-white dark:bg-slate-800 text-primary dark:text-indigo-300 py-3 rounded-btn font-bold text-xs hover:bg-indigo-50 dark:hover:bg-slate-700 shadow-sm flex items-center justify-center gap-2"
                >
                  <span>▶</span> Save &amp; Start Study
                </button>

                {isGenerating && (
                  <div className="bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 p-3 rounded-btn text-xs flex items-center gap-2 border border-emerald-100 dark:border-emerald-800 animate-pulse">
                    <span>⚙️</span>
                    <span>AI is currently processing your notes (Estimated 2s)</span>
                  </div>
                )}

                {saveStatus && (
                  <div className="bg-emerald-50 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 px-3 py-2 rounded-btn text-xs font-bold flex items-center gap-2 border border-emerald-200 dark:border-emerald-800">
                    <span>✓</span>
                    <span>{saveStatus}</span>
                  </div>
                )}
              </div>
            </div>

            <div className="flex-1 space-y-6">
              <div className="flex justify-between items-center">
                <div>
                  <h2 className="text-xl font-extrabold text-primary dark:text-white">{deckTitle}</h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Previewing {editableCards.length} generated cards</p>
                </div>
                <div className="flex gap-3">
                  <button onClick={handleAddCard} className="border border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-btn text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm flex items-center gap-1.5">
                    ➕ Add Card
                  </button>
                  <button onClick={() => persistDeck(false)} className="bg-primary dark:bg-indigo-600 text-white px-4 py-2 rounded-btn text-xs font-bold hover:bg-opacity-95 shadow flex items-center gap-1.5">
                    💾 Save Deck
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-6">
                {editableCards.map((card, i) => {
                  const isEditingThisCard = editingCardId === card.id;
                  return (
                    <div key={card.id} className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm flex flex-col justify-between items-center text-center relative group hover:border-slate-300 dark:hover:border-slate-600 transition-all min-h-[170px]">
                      <span className="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">CARD {i + 1}</span>

                      {isEditingThisCard ? (
                        <div className="w-full my-2 space-y-2">
                          <input
                            type="text"
                            value={editFrontText}
                            onChange={(e) => setEditFrontText(e.target.value)}
                            placeholder="Front text / term"
                            className="w-full p-1.5 text-xs font-bold border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 text-primary dark:text-white"
                          />
                          <input
                            type="text"
                            value={editBackText}
                            onChange={(e) => setEditBackText(e.target.value)}
                            placeholder="Back text / definition"
                            className="w-full p-1.5 text-xs border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200"
                          />
                          <button
                            onClick={() => handleSaveRenameCard(card.id)}
                            className="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-emerald-700 shadow"
                          >
                            Save Changes
                          </button>
                        </div>
                      ) : (
                        <div className="my-2 space-y-1">
                          <h3 className="text-base font-bold text-primary dark:text-white">{card.front}</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400">{card.back}</p>
                        </div>
                      )}

                      {!isEditingThisCard && (
                        <div className="flex gap-4 text-slate-400 text-xs pt-2">
                          <button onClick={() => handleStartRenameCard(card)} className="hover:text-primary dark:hover:text-white font-semibold">✏️ Rename</button>
                          <button onClick={() => handleDeleteCard(card.id)} className="hover:text-red-500 font-semibold">🗑️ Delete</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function FlashcardStudyScreen({ navigate, currentDeck, setCurrentDeck, flashcardDecks, setFlashcardDecks, deckCardIndex, setDeckCardIndex }) {
      const [isFlipped, setIsFlipped] = useState(false);

      const [sessionSeconds, setSessionSeconds] = useState(0);
      const [isTimerActive, setIsTimerActive] = useState(true);

      const [isRenamingDeck, setIsRenamingDeck] = useState(false);
      const [deckTitleInput, setDeckTitleInput] = useState(currentDeck ? currentDeck.title : '');

      const [isRenamingCard, setIsRenamingCard] = useState(false);
      const [renamedFront, setRenamedFront] = useState('');
      const [renamedBack, setRenamedBack] = useState('');

      const activeDeck = currentDeck || flashcardDecks[0] || DEFAULT_DECKS[0];
      const cards = activeDeck && Array.isArray(activeDeck.cards) && activeDeck.cards.length ? activeDeck.cards : DEFAULT_DECKS[0].cards;
      const safeIndex = cards.length ? Math.min(Math.max(deckCardIndex || 0, 0), cards.length - 1) : 0;
      const currentCard = cards[safeIndex] || cards[0] || null;
      const visibleIndex = cards.length ? safeIndex + 1 : 0;
      const remainingCards = cards.length ? Math.max(cards.length - visibleIndex, 0) : 0;

      useEffect(() => { if (activeDeck) cacheDeck(activeDeck); }, [activeDeck]);

      const handleShareDeck = () => {
        if (!activeDeck) return;
        const encodedData = btoa(JSON.stringify({ title: activeDeck.title, subject: activeDeck.subject, cards: activeDeck.cards.map(card => ({ front: card.front, back: card.back })) }));
        const shareLink = `${window.location.origin}${window.location.pathname}?sharedDeck=${encodedData}`;
        if (navigator.share) {
          navigator.share({ title: `📚 ${activeDeck.title} - ReviseSphere`, text: `Check out my ${activeDeck.subject} flashcards on ReviseSphere!`, url: shareLink }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(shareLink).then(() => window.alert('Deck link copied to clipboard.')).catch(() => {});
        }
      };

      useEffect(() => {
        if (!activeDeck) {
          setDeckTitleInput('');
          return;
        }
        setDeckCardIndex(0);
        setIsFlipped(false);
        setIsRenamingCard(false);
        setIsRenamingDeck(false);
        setDeckTitleInput(activeDeck.title);
      }, [activeDeck && activeDeck.id]);

      useEffect(() => {
        if (!isTimerActive) return;
        const interval = setInterval(() => {
          setSessionSeconds(sec => sec + 1);
        }, 1000);
        return () => clearInterval(interval);
      }, [isTimerActive]);

      const handleNextCardRef = useRef(null);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (isRenamingCard || isRenamingDeck) return;
          if (e.code === 'Space') {
            e.preventDefault();
            setIsFlipped(prev => !prev);
          } else if (e.key === '1' || e.key === '2' || e.key === '3') {
            if (handleNextCardRef.current) handleNextCardRef.current();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isRenamingCard, isRenamingDeck]);

      const formatSessionTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const [selectedDifficulty, setSelectedDifficulty] = useState(null);

      const resetDifficultySquareHighlight = () => {
        setSelectedDifficulty(null);
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
          btn.classList.remove('active');
        });
      };

      const handleResetDeck = useCallback(() => {
        setDeckCardIndex(0);
        setIsFlipped(false);
      }, []);

      const handleShuffleDeck = useCallback(() => {
        if (!cards.length || cards.length === 1) return;
        const shuffledCards = [...cards];
        for (let i = shuffledCards.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledCards[i], shuffledCards[j]] = [shuffledCards[j], shuffledCards[i]];
        }
        const updatedDeck = { ...activeDeck, cards: shuffledCards };
        setCurrentDeck(updatedDeck);
        setFlashcardDecks(prev => prev.map(deck => deck.id === updatedDeck.id ? updatedDeck : deck));
        setDeckCardIndex(0);
        setIsFlipped(false);
      }, [activeDeck, cards, setCurrentDeck, setFlashcardDecks]);

      const handleDifficulty = (level, btnElement) => {
        resetDifficultySquareHighlight();
        if (btnElement) btnElement.classList.add('active');
        setSelectedDifficulty(level);
        if (currentCard) {
          localStorage.setItem(`rs_bio_deck_1_${currentCard.id}`, level);
        }
        setTimeout(() => {
          handleNextCard();
          resetDifficultySquareHighlight();
        }, 300);
      };

      const handleNextCard = useCallback(() => {
        if (!cards.length) {
          setIsFlipped(false);
          return;
        }
        if (cards.length === 1) {
          setIsFlipped(false);
          setDeckCardIndex(0);
          return;
        }
        setIsFlipped(false);
        setDeckCardIndex(prev => (prev >= cards.length - 1 ? 0 : prev + 1));
      }, [cards.length]);

      handleNextCardRef.current = handleNextCard;

      const handlePrevCard = useCallback(() => {
        if (!cards.length) {
          setIsFlipped(false);
          return;
        }
        if (cards.length === 1) {
          setIsFlipped(false);
          setDeckCardIndex(0);
          return;
        }
        setIsFlipped(false);
        setDeckCardIndex(prev => (prev <= 0 ? cards.length - 1 : prev - 1));
      }, [cards.length]);

      const handleOpenCardRename = () => {
        if (!currentCard) return;
        setRenamedFront(currentCard.front);
        setRenamedBack(currentCard.back);
        setIsRenamingCard(true);
      };

      const handleSaveCardRename = () => {
        if (!currentCard || !activeDeck || !cards.length) return;
        const updatedCards = cards.map((c, idx) => idx === safeIndex ? { ...c, front: renamedFront.trim() || c.front, back: renamedBack.trim() || c.back } : c);
        const updatedDeck = { ...activeDeck, cards: updatedCards };
        setCurrentDeck(updatedDeck);
        setFlashcardDecks(prev => prev.map(d => d.id === activeDeck.id ? updatedDeck : d));
        setIsRenamingCard(false);
      };

      const handleSaveDeckRename = () => {
        if (!activeDeck) return;
        const updatedDeck = { ...activeDeck, title: deckTitleInput.trim() || activeDeck.title };
        setCurrentDeck(updatedDeck);
        setFlashcardDecks(prev => prev.map(d => d.id === activeDeck.id ? updatedDeck : d));
        setIsRenamingDeck(false);
      };

      return (
        <div className="flex gap-8 items-start pt-4 pb-12">
          <div className="w-60 bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-6 flex-shrink-0">
            <h3 className="font-extrabold text-sm text-primary dark:text-indigo-400 flex items-center gap-2">
              <img src="logo_icon.png" alt="Icon" className="w-5 h-5 object-contain" />
              Study Progress
            </h3>

            <div className="space-y-4">
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-600 dark:text-slate-400 font-medium">Cards Mastered</span>
                <span className="font-bold text-emerald-600 dark:text-emerald-400">{visibleIndex} / {cards.length}</span>
              </div>
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-600 dark:text-slate-400 font-medium">Remaining</span>
                <span className="font-bold text-amber-600 dark:text-amber-400">{remainingCards} Cards</span>
              </div>
              <div className="flex justify-between items-center text-xs">
                <span className="text-slate-600 dark:text-slate-400 font-medium">Study Streak</span>
                <span className="font-bold text-amber-500">8 Days 🔥</span>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-2">
              <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">SESSION TIMER</div>
              <div className="bg-slate-50 dark:bg-slate-700 p-3 rounded-lg border border-slate-200 dark:border-slate-600 flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="text-xs">⏱️</span>
                  <span className="font-mono text-xs font-bold text-primary dark:text-white">{formatSessionTime(sessionSeconds)}</span>
                </div>
                <button
                  onClick={() => setIsTimerActive(!isTimerActive)}
                  className="text-[10px] font-bold px-2 py-1 rounded bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200"
                >
                  {isTimerActive ? 'Pause' : 'Resume'}
                </button>
              </div>
            </div>

            <div className="pt-4 border-t border-slate-100 dark:border-slate-700 space-y-3">
              <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">KEYBOARD SHORTCUTS</div>
              <div className="space-y-2 text-xs text-slate-600 dark:text-slate-400 font-medium">
                <div className="flex justify-between items-center">
                  <span>Flip card</span>
                  <span className="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded text-[10px] font-bold text-slate-700 dark:text-slate-300">Space</span>
                </div>
                <div className="flex justify-between items-center">
                  <span>Mark Hard</span>
                  <span className="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded text-[10px] font-bold text-slate-700 dark:text-slate-300">1</span>
                </div>
                <div className="flex justify-between items-center">
                  <span>Mark Medium</span>
                  <span className="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded text-[10px] font-bold text-slate-700 dark:text-slate-300">2</span>
                </div>
                <div className="flex justify-between items-center">
                  <span>Mark Easy</span>
                  <span className="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded text-[10px] font-bold text-slate-700 dark:text-slate-300">3</span>
                </div>
              </div>
            </div>
          </div>

          <div className="flex-1 space-y-6">
            <div className="flex justify-between items-center">
              {isRenamingDeck ? (
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    value={deckTitleInput}
                    onChange={(e) => setDeckTitleInput(e.target.value)}
                    className="px-3 py-1 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white text-base font-bold rounded"
                  />
                  <button onClick={handleSaveDeckRename} className="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">Save Title</button>
                  <button onClick={() => setIsRenamingDeck(false)} className="text-slate-400 hover:text-slate-600 text-xs">Cancel</button>
                </div>
              ) : (
                <div className="flex items-center gap-3">
                  <h2 className="text-xl font-extrabold text-primary dark:text-white">{activeDeck ? activeDeck.title : 'Untitled Deck'}</h2>
                  <button onClick={() => { if (!activeDeck) return; setDeckTitleInput(activeDeck.title); setIsRenamingDeck(true); }} className="text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-bold">✏️ Rename Deck</button>
                </div>
              )}
              <div className="flex items-center gap-3"><button onClick={handleShareDeck} className="border border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-btn text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm">🔗 Share Deck</button><span className="text-xs font-bold text-slate-500 dark:text-slate-400">Card {visibleIndex} of {cards.length}</span></div>
            </div>

            <div
              onClick={() => !isRenamingCard && setIsFlipped(prev => !prev)}
              className="bg-white dark:bg-slate-800 rounded-card p-12 border border-borderClr dark:border-slate-700 shadow-xl min-h-[340px] flex flex-col justify-between items-center text-center relative cursor-pointer hover:border-slate-300 dark:hover:border-slate-600 transition-all select-none"
            >
              <div className="w-full flex justify-between items-center">
                <span className="text-[10px] font-extrabold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">
                  {isFlipped ? 'BACK (ANSWER)' : 'FRONT (QUESTION)'}
                </span>
                <button
                  onClick={(e) => { e.stopPropagation(); handleOpenCardRename(); }}
                  className="text-xs text-indigo-600 dark:text-indigo-400 font-bold hover:underline bg-indigo-50 dark:bg-indigo-950 px-2.5 py-1 rounded-md"
                >
                  ✏️ Rename Flashcard
                </button>
              </div>

              {isRenamingCard ? (
                <div className="w-full max-w-lg my-4 space-y-3 bg-slate-50 dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-700" onClick={(e) => e.stopPropagation()}>
                  <h4 className="text-xs font-bold text-slate-700 dark:text-slate-300">Rename Card Term &amp; Answer</h4>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 text-left mb-1">FRONT (QUESTION / TERM)</label>
                    <input
                      type="text"
                      value={renamedFront}
                      onChange={(e) => setRenamedFront(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white text-xs font-semibold rounded"
                    />
                  </div>
                  <div>
                    <label className="block text-[10px] font-bold text-slate-500 text-left mb-1">BACK (ANSWER / DEFINITION)</label>
                    <textarea
                      rows="3"
                      value={renamedBack}
                      onChange={(e) => setRenamedBack(e.target.value)}
                      className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white text-xs rounded leading-relaxed resize-none"
                    ></textarea>
                  </div>
                  <div className="flex gap-2 justify-end pt-1">
                    <button onClick={() => setIsRenamingCard(false)} className="px-3 py-1.5 rounded text-xs text-slate-500 font-semibold">Cancel</button>
                    <button onClick={handleSaveCardRename} className="bg-emerald-600 text-white px-4 py-1.5 rounded text-xs font-bold shadow">Save Changes</button>
                  </div>
                </div>
              ) : (
                <h2 className="text-2xl font-bold text-primary dark:text-white max-w-xl leading-relaxed my-6">
                  {isFlipped ? (currentCard ? currentCard.back : 'No cards available in this deck yet.') : (currentCard ? currentCard.front : 'No cards available in this deck yet.')}
                </h2>
              )}

              <button
                onClick={(e) => { e.stopPropagation(); setIsFlipped(prev => !prev); }}
                className="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 text-xs font-semibold px-4 py-2 rounded-btn flex items-center gap-2 border border-slate-200 dark:border-slate-600 transition-all"
              >
                🔄 Click card to flip
              </button>
            </div>

            <div className="text-center space-y-3 pt-2">
              <span className="text-xs text-slate-500 dark:text-slate-400 font-medium">How well did you know this card?</span>

              <div className="flex justify-center gap-4 max-w-md mx-auto">
                <button
                  onClick={(e) => handleDifficulty('hard', e.currentTarget)}
                  className="difficulty-btn bg-red-100 flex-1 border border-borderClr dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 py-3 rounded-btn text-xs font-bold flex items-center justify-center gap-2 shadow-sm"
                >
                  <span>☹️</span> Hard
                </button>
                <button
                  onClick={(e) => handleDifficulty('medium', e.currentTarget)}
                  className="difficulty-btn bg-yellow-100 flex-1 border border-borderClr dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 py-3 rounded-btn text-xs font-bold flex items-center justify-center gap-2 shadow-sm"
                >
                  <span>😐</span> Medium
                </button>
                <button
                  onClick={(e) => handleDifficulty('easy', e.currentTarget)}
                  className="difficulty-btn bg-green-100 flex-1 bg-primary dark:bg-indigo-600 text-white py-3 rounded-btn text-xs font-bold flex items-center justify-center gap-2 shadow"
                >
                  <span>😊</span> Easy
                </button>
              </div>

              <div className="flex justify-between items-center pt-4 max-w-md mx-auto">
                <button onClick={handlePrevCard} className="text-xs text-slate-500 hover:text-primary dark:hover:text-white font-semibold">← Previous Card</button>
                <button onClick={handleNextCard} className="text-xs text-slate-500 hover:text-primary dark:hover:text-white font-semibold">Next Card →</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function ProfileScreen({ navigate, user, setUser, isDarkMode, setIsDarkMode, quizHistory, flashcardDecks, handleLogout, activeTab = 'overview' }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editName, setEditName] = useState(user.name);
      const [editEmail, setEditEmail] = useState(user.email);
      const settingsRef = useRef(null);

      useEffect(() => {
        if (activeTab === 'settings' && settingsRef.current) {
          settingsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, [activeTab]);

      const baseQuizzesCount = 42;
      const totalQuizzesTaken = baseQuizzesCount + quizHistory.length - 2;

      const initialSum = 86.5 * baseQuizzesCount;
      const newScoresSum = quizHistory.slice(2).reduce((acc, item) => acc + item.percent, 0);
      const avgScore = ((initialSum + newScoresSum) / totalQuizzesTaken).toFixed(1);

      const activeDecksCount = flashcardDecks.length;

      const handleSaveProfile = () => {
        setUser(prev => ({
          ...prev,
          name: editName,
          email: editEmail
        }));
        setIsEditing(false);
      };

      return (
        <div className="space-y-6 pb-12">
          <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm flex items-center justify-between">
            <div className="flex items-center gap-5">
              <UserAvatar user={user} size="w-16 h-16" fontSize="text-xl" />
              <div>
                <div className="flex items-center gap-3">
                  <img src="logo_icon.png" alt="Icon" className="w-7 h-7 object-contain" />
                  <h1 className="text-xl font-extrabold text-primary dark:text-white">Amara Okeke</h1>
                  <span className="text-[10px] font-extrabold bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 px-2 py-0.5 rounded uppercase">PRO MEMBER</span>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1">amara.okeke@stanford.edu</p>
              </div>
            </div>

            <button
              onClick={() => setIsEditing(!isEditing)}
              className="border border-borderClr dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-btn text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm flex items-center gap-1.5"
            >
              ✏️ {isEditing ? 'Cancel' : 'Edit Profile'}
            </button>
          </div>

          {isEditing && (
            <div className="bg-slate-50 dark:bg-slate-800/80 p-6 rounded-card border border-slate-200 dark:border-slate-700 space-y-4">
              <h3 className="font-extrabold text-sm text-primary dark:text-white">Edit Student Details</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs text-slate-600 dark:text-slate-400 mb-1">Full Name</label>
                  <input
                    type="text"
                    value={editName}
                    onChange={(e) => setEditName(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-600 dark:text-slate-400 mb-1">Email Address</label>
                  <input
                    type="email"
                    value={editEmail}
                    onChange={(e) => setEditEmail(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs"
                  />
                </div>
              </div>
              <button onClick={handleSaveProfile} className="bg-primary dark:bg-indigo-600 text-white px-5 py-2 rounded-btn text-xs font-bold">Save Changes</button>
            </div>
          )}

          <div className="grid grid-cols-4 gap-6">
            <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-2">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">TOTAL QUIZZES TAKEN</span>
                <span className="text-indigo-600 bg-indigo-50 dark:bg-indigo-950 p-1.5 rounded-lg text-xs">🏅</span>
              </div>
              <div className="text-3xl font-black text-primary dark:text-white">{totalQuizzesTaken}</div>
              <div className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400">↑ Updated after submission</div>
            </div>

            <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-2">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">AVERAGE SCORE</span>
                <span className="text-emerald-600 bg-emerald-50 dark:bg-emerald-950 p-1.5 rounded-lg text-xs">📈</span>
              </div>
              <div className="text-3xl font-black text-emerald-600 dark:text-emerald-400">{avgScore}%</div>
              <div className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Top 5% of class</div>
            </div>

            <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-2">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">DECKS CREATED</span>
                <span className="text-amber-600 bg-amber-50 dark:bg-amber-950 p-1.5 rounded-lg text-xs">📚</span>
              </div>
              <div className="text-3xl font-black text-primary dark:text-white">{activeDecksCount}</div>
              <div className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Active study decks</div>
            </div>

            <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-2">
              <div className="flex justify-between items-start">
                <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">STUDY STREAK</span>
                <span className="text-amber-500 bg-amber-50 dark:bg-amber-950 p-1.5 rounded-lg text-xs">⚡</span>
              </div>
              <div className="text-3xl font-black text-amber-500">8 Days</div>
              <div className="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Personal best: 14 days</div>
            </div>
          </div>

          <StudyHoursChart isDarkMode={isDarkMode} />

          <div className="grid grid-cols-3 gap-6">
            <div className="col-span-2 bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="font-extrabold text-sm text-primary dark:text-white">Recent Activity</h3>
                <span className="text-xs text-emerald-600 dark:text-emerald-400 font-semibold">Live Profile Sync Active</span>
              </div>

              <div className="space-y-3">
                {quizHistory.map((item) => (
                  <div key={item.id} className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl flex justify-between items-center border border-slate-100 dark:border-slate-700 transition-all hover:border-slate-300">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 flex items-center justify-center text-xs font-bold">🏅</div>
                      <div>
                        <div className="font-bold text-xs text-slate-800 dark:text-slate-200">{item.title}</div>
                        <div className="text-[11px] text-slate-500 dark:text-slate-400">Completed {item.date} • {item.subject}</div>
                      </div>
                    </div>
                    <span className="font-bold text-xs text-emerald-600 dark:text-emerald-400">{item.percent}% Correct</span>
                  </div>
                ))}
              </div>
            </div>

            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
                <h3 className="font-extrabold text-sm text-primary dark:text-white">Achievements &amp; Badges</h3>

                <div className="space-y-3">
                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-xs">🔥</div>
                    <div>
                      <div className="font-bold text-xs text-slate-800 dark:text-slate-200">7-Day Streak</div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400">Active 7 days consecutively</div>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">🛡️</div>
                    <div>
                      <div className="font-bold text-xs text-slate-800 dark:text-slate-200">Quiz Master</div>
                      <div className="text-[10px] text-slate-500 dark:text-slate-400">Aced {quizHistory.length} quizzes</div>
                    </div>
                  </div>
                </div>
              </div>

              <div ref={settingsRef} className="bg-white dark:bg-slate-800 rounded-card p-6 border border-borderClr dark:border-slate-700 shadow-sm space-y-4">
                <h3 className="font-extrabold text-sm text-primary dark:text-white">Account Settings</h3>

                <div className="space-y-3 text-xs font-semibold text-slate-700 dark:text-slate-300">
                  <div className="flex justify-between items-center">
                    <span>Email Notifications</span>
                    <input type="checkbox" defaultChecked className="rounded text-primary focus:ring-primary w-4 h-4" />
                  </div>
                  <div className="flex justify-between items-center">
                    <span>Dark Mode Theme</span>
                    <input
                      type="checkbox"
                      checked={isDarkMode}
                      onChange={(e) => setIsDarkMode(e.target.checked)}
                      className="rounded text-primary focus:ring-primary w-4 h-4 cursor-pointer"
                    />
                  </div>
                </div>

                <button onClick={handleLogout} className="w-full border border-red-200 text-red-600 dark:border-red-800 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950 py-2.5 rounded-btn font-bold text-xs transition-colors mt-2">
                  Log Out
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>

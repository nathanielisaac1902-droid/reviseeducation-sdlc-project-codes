<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReviseSphere | Login</title>
  <link rel="icon" type="image/png" href="logo_icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#1E2A4A',
            primaryDark: '#0F172A',
            bgMain: '#F5F7FB',
            accentBtn: '#DCEFD3',
            accent: '#C7E4C7',
            success: '#16A34A',
            error: '#DC2626',
            borderClr: '#E5E7EB',
            textMain: '#111827',
            textGray: '#6B7280'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'card': '16px',
            'btn': '8px',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="auth.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>

<body class="bg-bgMain text-textMain dark:bg-slate-900 dark:text-slate-100 antialiased min-h-screen flex items-center justify-center py-12">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Check if already authenticated
    if (window.ReviseAuth && window.ReviseAuth.isAuthenticated()) {
      window.location.href = 'index.html';
    }

    const LogoIcon = () => (
      <div className="flex flex-col items-center justify-center">
        <img
          src="logo.png"
          alt="ReviseSphere Official Logo"
          className="w-56 h-auto object-contain mx-auto filter drop-shadow-md hover:scale-105 transition-transform duration-300"
          onError={(e) => {
            e.target.onerror = null;
            e.target.style.display = 'none';
          }}
        />
      </div>
    );

    function LoginPage() {
      const [emailInput, setEmailInput] = useState('amara.okeke@stanford.edu');
      const [passInput, setPassInput] = useState('••••••••••••');
      const [forgotModalOpen, setForgotModalOpen] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotSent, setForgotSent] = useState(false);

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        if (window.ReviseAuth) {
          window.ReviseAuth.loginUser(emailInput, passInput);
        }
        window.location.href = 'index.html';
      };

      const handleGuestLogin = () => {
        const guestUser = {
          name: 'Guest Student',
          email: 'guest@revisesphere.edu',
          isPro: false,
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80'
        };
        if (window.ReviseAuth) {
          window.ReviseAuth.setAuthUser(guestUser);
        }
        window.location.href = 'index.html';
      };

      const handleSendResetLink = (e) => {
        e.preventDefault();
        if (!forgotEmail) return;
        setForgotSent(true);
        setTimeout(() => {
          setForgotSent(false);
          setForgotModalOpen(false);
          setForgotEmail('');
        }, 3000);
      };

      return (
        <div className="w-full max-w-4xl mx-auto px-4">
          <div className="bg-white dark:bg-slate-800 rounded-[24px] shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[580px] border border-borderClr dark:border-slate-700 transition-all">
            {/* Left Banner */}
            <div className="w-full md:w-5/12 bg-primary dark:bg-slate-950 p-8 md:p-12 text-white flex flex-col justify-center items-center text-center relative border-b md:border-b-0 md:border-r border-slate-800">
              <div className="mb-6 bg-white dark:bg-slate-900 p-5 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-800">
                <LogoIcon />
              </div>
              <h1 className="text-3xl font-extrabold mb-3 tracking-tight text-white">Welcome Back!</h1>
              <p className="text-slate-300 text-sm leading-relaxed max-w-xs">
                Unlock your ReviseSphere workspace to master your upcoming exams with AI tools.
              </p>
            </div>

            {/* Right Form Container */}
            <div className="w-full md:w-7/12 p-8 md:p-12 flex flex-col justify-center bg-white dark:bg-slate-800">
              <div className="max-w-md mx-auto w-full space-y-6">
                <div className="bg-slate-100 dark:bg-slate-700/60 p-1 rounded-lg flex">
                  <button className="flex-1 py-2.5 text-xs font-bold rounded-md bg-primary dark:bg-indigo-600 text-white shadow">
                    Log In
                  </button>
                  <a
                    href="signup.html"
                    className="flex-1 text-center py-2.5 text-xs font-semibold rounded-md text-slate-500 dark:text-slate-300 hover:text-slate-800 dark:hover:text-white transition-colors"
                  >
                    Sign Up
                  </a>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Email or Username
                    </label>
                    <input
                      type="text"
                      value={emailInput}
                      onChange={(e) => setEmailInput(e.target.value)}
                      placeholder="e.g. amara.okeke@stanford.edu"
                      className="w-full px-3.5 py-2.5 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                      required
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                      Password
                    </label>
                    <input
                      type="password"
                      value={passInput}
                      onChange={(e) => setPassInput(e.target.value)}
                      placeholder="••••••••••••"
                      className="w-full px-3.5 py-2.5 border border-borderClr dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                      required
                    />
                  </div>

                  <div className="flex items-center justify-between text-xs pt-1">
                    <label className="flex items-center gap-2 text-slate-600 dark:text-slate-400 cursor-pointer">
                      <input type="checkbox" defaultChecked className="rounded text-primary focus:ring-primary w-4 h-4" />
                      <span>Remember me</span>
                    </label>
                    <button
                      type="button"
                      onClick={() => { setForgotEmail(emailInput); setForgotModalOpen(true); }}
                      className="text-primary dark:text-indigo-400 font-bold hover:underline"
                    >
                      Forgot password?
                    </button>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-primary dark:bg-indigo-600 text-white py-3 rounded-btn font-bold text-xs hover:bg-opacity-90 transition-all shadow-md mt-2 cursor-pointer"
                  >
                    Log In
                  </button>
                </form>

                <div className="relative my-6 text-center">
                  <div className="absolute inset-0 flex items-center">
                    <div className="w-full border-t border-slate-200 dark:border-slate-700"></div>
                  </div>
                  <span className="relative px-3 bg-white dark:bg-slate-800 text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">
                    OR CONTINUE WITH
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={handleLogin}
                    className="border border-borderClr dark:border-slate-600 py-2.5 rounded-btn text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center justify-center gap-2 transition-colors"
                  >
                    <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z" /><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.24v3.15C3.26 21.4 7.37 24 12 24z" /><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.24C.45 8.15 0 9.99 0 12s.45 3.85 1.24 5.42l4.04-3.15z" /><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.6 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z" /></svg>
                    Google
                  </button>
                  <button
                    type="button"
                    onClick={handleGuestLogin}
                    className="border border-borderClr dark:border-slate-600 py-2.5 rounded-btn text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors"
                  >
                    As a Guest
                  </button>
                </div>

                <div className="text-center pt-2">
                  <span className="text-xs text-slate-500 dark:text-slate-400">
                    Don't have an account?{' '}
                    <a
                      href="signup.html"
                      className="text-primary dark:text-indigo-400 font-bold hover:underline"
                    >
                      Sign Up
                    </a>
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* Forgot Password Modal */}
          {forgotModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                  <h3 className="font-extrabold text-base text-primary dark:text-white">Reset Password</h3>
                  <button onClick={() => setForgotModalOpen(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold">✕</button>
                </div>

                {forgotSent ? (
                  <div className="bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300 p-4 rounded-xl text-xs font-semibold text-center space-y-1">
                    <div className="text-xl">✅</div>
                    <p>Password reset link has been sent to <strong>{forgotEmail}</strong>!</p>
                  </div>
                ) : (
                  <form onSubmit={handleSendResetLink} className="space-y-4">
                    <p className="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                      Enter the email address associated with your ReviseSphere account and we'll send you a password reset link.
                    </p>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                      <input
                        type="email"
                        value={forgotEmail}
                        onChange={(e) => setForgotEmail(e.target.value)}
                        placeholder="name@example.com"
                        className="w-full px-3.5 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-btn text-xs"
                        required
                      />
                    </div>
                    <div className="flex gap-2 justify-end pt-2">
                      <button type="button" onClick={() => setForgotModalOpen(false)} className="px-4 py-2 rounded-btn text-xs text-slate-500 font-bold hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                      <button type="submit" className="bg-primary dark:bg-indigo-600 text-white px-5 py-2 rounded-btn text-xs font-bold shadow">Send Reset Link</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<LoginPage />);
  </script>
</body>

</html>
